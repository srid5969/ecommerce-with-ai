services:
  db:
    image: pgvector/pgvector:pg17 # Postgres 17 + pgvector extension preinstalled
    container_name: vectorsearch-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectorsearch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
